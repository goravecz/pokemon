spring:
  application:
    name: pokemon
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/battle_history_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

#Uncomment com.accenture.pokemon.client for verbose logging in pokeapi client
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    #com.accenture.pokemon.client: DEBUG

pokeapi:
  base-url: https://pokeapi.co/api/v2
  pokemon-path: /pokemon/
  timeout:
    connect-ms: 5000
    read-ms: 10000
  retry:
    max-attempts: 3
    initial-backoff-ms: 100
    multiplier: 2.0
    max-interval: 10000
