spring:
  application:
    name: pokemon

# uncomment for verbose response logging
#logging:
#  level:
#    com.accenture.pokemon.client: DEBUG

pokeapi:
  base-url: https://pokeapi.co/api/v2
  pokemon-path: /pokemon/
  timeout:
    connect-ms: 5000
    read-ms: 10000
  retry:
    max-attempts: 3
    initial-backoff-ms: 100
    multiplier: 2.0
    max-interval: 10000
