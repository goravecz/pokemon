spring:
  application:
    name: pokemon-test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

pokeapi:
  base-url: https://pokeapi.co/api/v2
  pokemon-path: /pokemon/
  timeout:
    connect-ms: 5000
    read-ms: 10000
  retry:
    max-attempts: 3
    initial-backoff-ms: 100
    multiplier: 2.0
    max-interval: 10000

logging:
  level:
    com.accenture.pokemon: INFO
